  <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="90" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">CSCloud FinOps · Shift-Left en Pull Request (Terraform / GitHub Actions)</text>

  <!-- PR Comment Mockup -->
  <g transform="translate(30, 58)">
