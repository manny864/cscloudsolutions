      <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">RECURSO TERRAFORM</text>
      <text x="340" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">ACCIÓN</text>
      <text x="480" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">SKU / TIPO</text>
      <text x="690" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#64748B">DELTA COSTO</text>

      <line x1="0" y1="36" x2="892" y2="36" stroke="#16273F"/>

      <!-- Item 1 -->
      <text x="16" y="60" font-family="monospace" font-size="12" fill="#FFFFFF">azurerm_linux_virtual_machine.api</text>
      <rect x="340" y="47" width="55" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
      <text x="346" y="60" font-family="system-ui" font-size="10" font-weight="bold" fill="#34D399">+ Crear</text>
      <text x="480" y="60" font-family="system-ui" font-size="12" fill="#94A3B8">Standard_D4s_v5 (East US)</text>
      <text x="690" y="60" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">+$140.16 USD/m</text>

      <line x1="0" y1="76" x2="892" y2="76" stroke="#16273F"/>

      <!-- Item 2 -->
      <text x="16" y="100" font-family="monospace" font-size="12" fill="#FFFFFF">azurerm_managed_disk.data</text>
      <rect x="340" y="87" width="55" height="18" rx="4" fill="#10B981" fill-opacity="0.2"/>
      <text x="346" y="100" font-family="system-ui" font-size="10" font-weight="bold" fill="#34D399">+ Crear</text>
      <text x="480" y="100" font-family="system-ui" font-size="12" fill="#94A3B8">Premium SSD P15 256GB</text>
      <text x="690" y="100" font-family="system-ui" font-size="12" font-weight="bold" fill="#FFFFFF">+$44.04 USD/m</text>

      <line x1="0" y1="116" x2="892" y2="116" stroke="#16273F"/>
      <text x="16" y="136" font-family="system-ui, sans-serif" font-size="10" fill="#64748B">Presupuesto restante del Centro de Costos "Backend API": $3,790 USD. El PR representa el 4.8% del remanente.</text>
