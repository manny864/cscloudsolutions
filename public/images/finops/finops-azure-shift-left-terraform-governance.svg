    <text x="24" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Monitorea la actividad real antes del apagado programado para evitar la caída de procesos activos.</text>

    <g transform="translate(24, 68)">
      <rect width="280" height="46" rx="6" fill="#16273F"/>
