    <g transform="translate(320, 68)">
      <rect width="280" height="46" rx="6" fill="#16273F"/>
      <text x="14" y="20" font-family="system-ui" font-size="11" font-weight="bold" fill="#FFFFFF">vm-qa-db-test</text>
      <text x="14" y="36" font-family="system-ui" font-size="10" fill="#F59E0B">CPU: 8.4% · Apagado Omitido (Trabajando)</text>
    </g>
    <g transform="translate(615, 68)">
      <rect width="300" height="46" rx="6" fill="#004F8A"/>
      <text x="16" y="20" font-family="system-ui" font-size="11" font-weight="bold" fill="#FFFFFF">Ahorro Mensual Recuperado</text>
      <text x="16" y="36" font-family="system-ui" font-size="13" font-weight="800" fill="#38BDF8">$2,840 USD fuera de horario</text>
