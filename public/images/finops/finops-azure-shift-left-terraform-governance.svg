      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#22C55E">+$184.20 USD / mes <tspan font-size="12" font-weight="normal" fill="#94A3B8">(Precio con descuento contrato EA aplicado)</tspan></text>
      <rect x="730" y="20" width="140" height="30" rx="6" fill="#10B981" fill-opacity="0.2"/>
