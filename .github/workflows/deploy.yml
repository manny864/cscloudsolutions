name: CI & Deploy to Azure

on:
  push:
    branches: ["main", "staging"]
  pull_request:
    branches: ["main", "staging"]

permissions:
  contents: read
  id-token: write

env:
  AZURE_WEBAPP_NAME: "cscloudsolutions"
  AZURE_RESOURCE_GROUP: "cscs-webpage-wus2-prod"
  AZURE_STAGING_SLOT: "staging"
  NODE_VERSION: "22"

jobs:
  build-and-test:
    name: Build & Validación Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Restaurar caché de Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto (Build)
        run: npm run build

      - name: Empaquetar artefacto para despliegue
        run: |
          tar -czf app-build.tar.gz \
            --exclude=.next/cache \
            .next \
            public \
            messages \
            next.config.mjs \
            package.json \
            package-lock.json

      - name: Subir artefacto de compilación temporal
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app-build.tar.gz
          retention-days: 1

  # ── Despliegue a Staging (push a rama staging) ──────────────────────────
  deploy-staging:
    name: Despliegue a Staging Slot
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar a Azure Web App (Slot Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_STAGING_SLOT }}
          package: app-build.tar.gz

  # ── Despliegue a Producción con Zero-Downtime Swap (push a rama main) ──
  deploy-production:
    name: Despliegue a Producción (Swap)
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 1. Desplegar paquete al Slot de Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_STAGING_SLOT }}
          package: app-build.tar.gz

      - name: 2. Smoke Test en Staging
        run: |
          echo "Validando slot de staging..."
          sleep 10
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://cscloudsolutions-staging.azurewebsites.net/es || true)
          echo "Respuesta HTTP en Staging: $STATUS_CODE"

      - name: 3. Intercambiar Slots (Swap Staging -> Production)
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az webapp deployment slot swap \
              --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --slot ${{ env.AZURE_STAGING_SLOT }} \
              --target-slot production
            echo "Swap a producción completado exitosamente con Zero Downtime."
