name: CI & Deploy

on:
  push:
    # staging: corre solo el job de build (validación pre-PR).
    # main: build + deploy al VPS (el job deploy está gateado por ref abajo).
    branches: ["main", "staging"]
  pull_request:

jobs:
  # ── Job único: Build & Validación (+ Deploy al VPS solo en push a main) ──
  # Nota: build y deploy corren en el MISMO job y el .tar.gz se copia directo
  # al VPS por SCP, sin pasar por GitHub Artifacts. Esto evita depender de la
  # cuota de storage de Actions (compartida a nivel de cuenta con otros repos),
  # que venía bloqueando el deploy con "Artifact storage quota has been hit".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Restaurar caché de Next.js
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          # Genera una nueva clave de caché cuando cambian las dependencias o el código fuente
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          # Si el código cambió pero las dependencias no, restaura desde una caché anterior
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar proyecto (Build)
        run: npm run build

      - name: Comprimir archivos compilados
        run: tar -czf app-build.tar.gz --exclude=.next/cache .next public package.json package-lock.json

      # ── A partir de acá: solo en push a main ──────────────────────
      - name: Copiar código compilado al VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "app-build.tar.gz"
          target: "~/cscloud/web"

      - name: Reiniciar Docker en el VPS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/cscloud/web
            git pull origin main
            tar -xzf app-build.tar.gz
            rm app-build.tar.gz
            # Asegurarse de que el Dockerfile no compile desde cero
            sed -i '/RUN npm run build/d' Dockerfile || true
            docker compose up -d --build
